name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv

      - name: Install Composer dependencies
        run: |
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies and build assets
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Export Static Site (SSG)
        run: |
          mkdir -p dist
          rm -f public/hot
          # Render static index.html using Blade
          php -r "putenv('ASSET_URL=/'); require 'vendor/autoload.php'; \$app = require_once 'bootstrap/app.php'; \$kernel = \$app->make(Illuminate\Contracts\Console\Kernel::class); \$kernel->bootstrap(); file_put_contents('dist/index.html', view('welcome')->render());"
          # Copy static assets to dist directory
          cp -r public/build dist/
          cp -r public/img dist/
          cp public/favicon.ico dist/ 2>/dev/null || true
          cp public/robots.txt dist/ 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brokolidev
